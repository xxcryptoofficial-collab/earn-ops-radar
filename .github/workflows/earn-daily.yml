name: Earn public cloud daily
on:
  workflow_dispatch:
  schedule:
    - cron: '10 1 * * *' # 09:10 Asia/Shanghai; scheduled jobs may delay.
permissions:
  contents: write
concurrency:
  group: earn-public-single-writer
  cancel-in-progress: false
jobs:
  public-daily:
    if: github.repository == 'xxcryptoofficial-collab/earn-ops-radar' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: earn-public-data
          path: public-data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Real public reads into separate data worktree
        id: collect
        run: node runtime/scripts/cloud-daily.mjs --output-root public-data
      - name: Persist only public data or terminal attempt
        if: always()
        working-directory: public-data
        run: |
          test "$GITHUB_REPOSITORY" = xxcryptoofficial-collab/earn-ops-radar
          test "$GITHUB_REF" = refs/heads/main
          test "$(git branch --show-current)" = earn-public-data
          for file in earn-snapshot.json run-status.json research-references.json current.json latest-attempt.json; do
            if test -f "$file"; then git add -- "$file"; fi
          done
          if test -d releases; then git add -- releases; fi
          node ../runtime/scripts/check-public-staging.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Earn public cloud data [skip ci]'
          git push origin HEAD:refs/heads/earn-public-data
          if test "${{ steps.collect.outcome }}" = success; then
            node ../runtime/scripts/write-publication-receipt.mjs . "$(git rev-parse HEAD)"
            git add -- latest-attempt.json
            node ../runtime/scripts/check-public-staging.mjs
            git commit -m 'Earn public data persisted receipt [skip ci]'
            git push origin HEAD:refs/heads/earn-public-data
          fi
      - name: Verify published immutable raw data release
        id: verify
        if: steps.collect.outcome == 'success'
        run: node runtime/scripts/verify-public-data.mjs public-data
      - name: Persist verified publication receipt
        if: steps.verify.outcome == 'success'
        working-directory: public-data
        run: |
          git add -- latest-attempt.json
          node ../runtime/scripts/check-public-staging.mjs
          git commit -m 'Earn public data verified receipt [skip ci]'
          git push origin HEAD:refs/heads/earn-public-data
